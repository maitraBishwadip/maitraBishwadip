name: Generate 3D contribution chart

on:
  schedule:
    - cron: "0 1 * * *"   # regenerates daily (offset from snake)
  workflow_dispatch:        # lets you run it manually right now
  push:
    branches: [main]        # first run happens automatically on push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          git diff --cached --quiet || git commit -m "Update 3D contribution chart"
          git push
