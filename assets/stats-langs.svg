    <rect class="r" style="animation-delay:0.20s" x="341.8" y="58" width="134.9" height="12" fill="#3572A5"/>
    <rect class="r" style="animation-delay:0.30s" x="476.6" y="58" width="12.7" height="12" fill="#f1e05a"/>
    <rect class="r" style="animation-delay:0.40s" x="489.3" y="58" width="4.4" height="12" fill="#8B949E"/>
    <rect class="r" style="animation-delay:0.50s" x="493.7" y="58" width="1.6" height="12" fill="#8B949E"/>
    <rect class="r" style="animation-delay:0.60s" x="495.4" y="58" width="0.6" height="12" fill="#663399"/>
