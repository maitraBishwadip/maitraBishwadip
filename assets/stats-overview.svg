    <text x="492" y="126" text-anchor="end" font-size="15" font-weight="700" fill="#E2E8F0">9</text>
  </g>
  <g class="r" style="animation-delay:0.46s">
    <rect x="26" y="143" width="9" height="9" rx="1.5" transform="rotate(45 30.5 147.5)" fill="#7DD3FC"/>
