    <text x="492" y="153" text-anchor="end" font-size="15" font-weight="700" fill="#E2E8F0">20</text>
  </g>
  <g class="r" style="animation-delay:0.58s">
    <rect x="26" y="170" width="9" height="9" rx="1.5" transform="rotate(45 30.5 174.5)" fill="#A5B4FC"/>
